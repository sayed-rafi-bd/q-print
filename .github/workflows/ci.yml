name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Formatting, lint rules and import order (Biome). Needs no Rust or Tauri setup, so it is quick.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4          # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  # Type-check and unit tests of the TypeScript side (the data generator and the label registry).
  typescript:
    if: false   # TEMPORARILY DISABLED
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  # Rust unit tests for label storage. Separate from `typescript` so a TS failure does not wait
  # behind the Rust build.
  rust-tests:
    if: false   # TEMPORARILY DISABLED
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib

  # Type-check and build the React frontend (tsc && vite build).
  frontend:
    if: false   # TEMPORARILY DISABLED
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4          # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  # Windows backend (SumatraPDF + PowerShell code). Only compiles it; nothing is printed.
  rust-windows:
    if: false   # TEMPORARILY DISABLED
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: cargo check (Windows)
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets
      - name: cargo clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

  # The non-Windows fallback backend (print_other.rs) and the shared code.
  rust-linux:
    if: false   # TEMPORARILY DISABLED
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets

  # The Android backend and the Kotlin plugin's Rust half. `cargo check` does not link, so no NDK is needed.
  rust-android:
    if: false   # TEMPORARILY DISABLED
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo check --manifest-path src-tauri/Cargo.toml --target aarch64-linux-android

  # Builds the debug APK, which compiles the Kotlin plugin (PrintPlugin.kt / PdfFileAdapter.kt) through Gradle.
  android-apk:
    if: false   # TEMPORARILY DISABLED
    runs-on: ubuntu-latest
    needs: [frontend, rust-android]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install NDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' | head -n 1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "ndk;27.0.12077973" "platforms;android-36"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Generate the Android project if it is not committed
        run: |
          if [ ! -d src-tauri/gen/android ]; then pnpm tauri android init --ci; fi
      # A project committed from Windows has no executable bit on gradlew, which makes Gradle fail on Linux.
      - name: Make gradlew executable
        run: chmod +x src-tauri/gen/android/gradlew
      - name: Build debug APK
        run: pnpm build:android:debug
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
