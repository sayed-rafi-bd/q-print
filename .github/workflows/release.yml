name: Release

# Push a tag such as v0.2.0 to build the Windows installers (unsigned for now) and a signed Android APK and attach them to a draft release.
# Releases are only built from commits that are on main: a tag pointing anywhere else fails the `verify-main` job.
on:
  push:
    tags: ["v*"]

jobs:
  verify-main:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Require the tagged commit to be on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} (${GITHUB_SHA}) is not on main. Releases are only built from main."
            exit 1
          fi

  windows:
    needs: verify-main
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Write .env from secrets
        shell: bash
        env:
          VITE_TURSO_URL: ${{ secrets.VITE_TURSO_URL }}
          VITE_TURSO_TOKEN: ${{ secrets.VITE_TURSO_TOKEN }}
        run: |
          if [ -z "$VITE_TURSO_URL" ] || [ -z "$VITE_TURSO_TOKEN" ]; then
            echo "::error::Add VITE_TURSO_URL and VITE_TURSO_TOKEN as repository secrets (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          printf 'VITE_TURSO_URL=%s\nVITE_TURSO_TOKEN=%s\n' "$VITE_TURSO_URL" "$VITE_TURSO_TOKEN" > .env
      # DISABLED: Windows code signing. Re-enable this step and "Verify Windows signatures" below to sign again.
