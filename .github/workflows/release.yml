  android:
    # Wait for the Windows job so both attach to the same draft release instead of racing to create two.
    needs: windows
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Install NDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' | head -n 1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "ndk;27.0.12077973" "platforms;android-36"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      #          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Write .env from secrets
        shell: bash
        env:
          VITE_TURSO_URL: ${{ secrets.VITE_TURSO_URL }}
          VITE_TURSO_TOKEN: ${{ secrets.VITE_TURSO_TOKEN }}
        run: |
          if [ -z "$VITE_TURSO_URL" ] || [ -z "$VITE_TURSO_TOKEN" ]; then
            echo "::error::Add VITE_TURSO_URL and VITE_TURSO_TOKEN as repository secrets (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          printf 'VITE_TURSO_URL=%s\nVITE_TURSO_TOKEN=%s\n' "$VITE_TURSO_URL" "$VITE_TURSO_TOKEN" > .env
      - run: if [ ! -d src-tauri/gen/android ]; then pnpm tauri android init --ci; fi
      # A project committed from Windows has no executable bit on gradlew, which makes Gradle fail on Linux.
      - name: Make gradlew executable
        run: chmod +x src-tauri/gen/android/gradlew
      # `pnpm build:android` moves the APKs out of Gradle's output folder into releases/.
      - name: Build release APK
        run: pnpm build:android
      - name: Sign the APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for v in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing repository secret $v (Settings > Secrets and variables > Actions)."
              exit 1
            fi
          done
          shopt -s nullglob
          apks=(releases/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "::error::No APK found in releases/ to sign."
            exit 1
          fi
          KEYSTORE="$RUNNER_TEMP/release-keystore.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          for apk in "${apks[@]}"; do
            final="${apk/-unsigned/}"
            "$APKSIGNER" sign \
              --ks "$KEYSTORE" \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
              --key-pass env:ANDROID_KEY_PASSWORD \
              --out "$apk.signed" "$apk"
            rm "$apk"
            mv "$apk.signed" "$final"
            "$APKSIGNER" verify --print-certs "$final"
          done
          rm -f "$KEYSTORE"
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          fail_on_unmatched_files: true
          files: releases/*.apk
