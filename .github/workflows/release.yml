name: Release

# Push a tag such as v0.2.0 to build the Windows installers and an Android APK and attach them to a draft release.
# Releases are only built from commits that are on main: a tag pointing anywhere else fails the `verify-main` job.
on:
  push:
    tags: ["v*"]

jobs:
  verify-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require the tagged commit to be on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} (${GITHUB_SHA}) is not on main. Releases are only built from main."
            exit 1
          fi

  windows:
    needs: verify-main
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Write .env from secrets
        shell: bash
        env:
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_TOKEN: ${{ secrets.TURSO_TOKEN }}
        run: |
          if [ -z "$TURSO_URL" ] || [ -z "$TURSO_TOKEN" ]; then
            echo "::error::Add TURSO_URL and TURSO_TOKEN as repository secrets (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          printf 'VITE_TURSO_URL=%s\nVITE_TURSO_TOKEN=%s\n' "$TURSO_URL" "$TURSO_TOKEN" > .env
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Q-Print ${{ github.ref_name }}"
          releaseDraft: true

  android:
    # Wait for the Windows job so both attach to the same draft release instead of racing to create two.
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install NDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' | head -n 1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "ndk;27.0.12077973" "platforms;android-36"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Write .env from secrets
        shell: bash
        env:
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_TOKEN: ${{ secrets.TURSO_TOKEN }}
        run: |
          if [ -z "$TURSO_URL" ] || [ -z "$TURSO_TOKEN" ]; then
            echo "::error::Add TURSO_URL and TURSO_TOKEN as repository secrets (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          printf 'VITE_TURSO_URL=%s\nVITE_TURSO_TOKEN=%s\n' "$TURSO_URL" "$TURSO_TOKEN" > .env
      - run: if [ ! -d src-tauri/gen/android ]; then pnpm tauri android init --ci; fi
      # A project committed from Windows has no executable bit on gradlew, which makes Gradle fail on Linux.
      - name: Make gradlew executable
        run: chmod +x src-tauri/gen/android/gradlew
      - name: Build release APK (unsigned unless you add signing)
        run: pnpm build:android
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          fail_on_unmatched_files: true
          files: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
