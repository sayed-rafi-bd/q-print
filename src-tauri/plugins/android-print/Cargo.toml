[package]
name = "tauri-plugin-android-print"
version = "0.1.0"
edition = "2021"
description = "Opens Android's system print dialog (PrintManager) for a PDF file."
# `links` lets tauri-build discover the plugin's Android project and add it to the Gradle build.
links = "tauri-plugin-android-print"

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
