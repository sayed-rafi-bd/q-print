[package]
name = "q-print"
version = "1.4.0"
edition = "2021"

[lib]
name = "q_print_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` is the desktop tray (Windows, Linux, macOS). `image-png` lets the app icon be used as
# the tray icon, which is the one image format available on every desktop target without extra deps.
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# IPP printing (direct.rs) and a label's API data source (http.rs). `tls` adds HTTPS with rustls and
# the bundled Mozilla root certificates; `ring` compiles a little C, so Android needs the NDK's clang
# (which the APK build already installs). The desktop-only table below adds the OS trust store.
ureq = { version = "2", default-features = false, features = ["tls"] }
url = "2"       # parsing the data source address, and checking where a redirect points
base64 = "0.22"   # page bitmaps travel between the Kotlin plugin and Rust as Base64

# On desktop, trust the operating system's certificate store as well, so a company proxy that
# re-signs HTTPS traffic with its own root CA works. This REPLACES the bundled roots inside ureq,
# and Android has no such store (it would find none and fail every request), so Android keeps the
# bundled roots only. Cargo merges these features with the `tls` ones above on desktop builds.
[target.'cfg(not(target_os = "android"))'.dependencies]
ureq = { version = "2", default-features = false, features = ["native-certs"] }
# The local print API (api_server.rs). Desktop only, so neither crate reaches the APK:
#   tiny_http  a small synchronous HTTP server. Synchronous is the right fit: the handlers block
#              on a printer or on the webview either way, and it needs no async runtime of its own.
#   getrandom  the 32 random bytes the API's bearer token is made from.
tiny_http = "0.12"
getrandom = "0.3"

# The `printers` crate has no Android support, so only Windows uses it.
[target.'cfg(windows)'.dependencies]
printers = "2"

# Kotlin plugin that opens Android's system print dialog (PrintManager).
[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-android-print = { path = "plugins/android-print" }

# The release build ships inside an APK, where every byte of the Rust library is multiplied by the
# number of architectures it is built for. The defaults here are no LTO, no stripping and sixteen
# code-generation units, all of which cost size: a debug build is not much smaller. These settings
# trade build time for a smaller APK, and strip also means no symbols to ship accidentally.
[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
# `panic = "abort"` would save a little more, but it turns any panic anywhere into a hard crash and
# the app runs printing work on worker threads, so it is left on the default unwind.
