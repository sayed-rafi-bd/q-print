[package]
name = "print-test"
version = "0.1.0"
edition = "2021"

[lib]
name = "print_test_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
printers = "2"   # list printers on every OS
rand = "0.8"     # random label data
serde = { version = "1", features = ["derive"] }
