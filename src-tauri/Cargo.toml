[package]
name = "print-test"
version = "0.1.0"
edition = "2021"

[lib]
name = "print_test_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
rand = "0.8"     # random label data
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Plain HTTP only (no TLS) for IPP printing; keeps the Android build free of C/TLS dependencies.
ureq = { version = "2", default-features = false }
base64 = "0.22"   # page bitmaps travel between the Kotlin plugin and Rust as Base64

# The `printers` crate has no Android support, so only Windows uses it.
[target.'cfg(windows)'.dependencies]
printers = "2"

# Kotlin plugin that opens Android's system print dialog (PrintManager).
[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-android-print = { path = "plugins/android-print" }
